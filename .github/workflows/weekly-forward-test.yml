name: 週次 前進検証

# 土曜 9:00 JST(= 土曜 0:00 UTC)。手動実行も可。
# 凍結中のC009/C009v2を新データで機械追跡し、結果をコミットする。パラメータは変更しない。
on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fx-trading-strategy-i2jwi7
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 価格データのキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            data/raw_histdata
            data/raw_bi5
          key: fxdata-${{ github.run_id }}
          restore-keys: fxdata-

      - name: 価格データ準備
        run: python scripts/data/download_histdata.py

      - name: 前進検証
        run: |
          set -o pipefail
          python scripts/ops/forward_test.py 2>&1 | tee forward_out.txt

      - name: 介入・急変チェック
        run: python scripts/ops/intervention_detector.py || true

      - name: 結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/forward logs/intervention_status.json
          if git diff --cached --quiet; then
            echo "変化なし(コミットなし)"
            exit 0
          fi
          {
            echo "前進検証の自動更新($(date -u -d '+9 hours' '+%Y-%m-%d') JST)"
            echo ""
            grep -E '前進シグナル|確定EV_R|カバレッジ' logs/forward/summary.md | head -8
            echo ""
            echo "Generated by GitHub Actions (weekly-forward-test)"
          } > commit_msg.txt
          git commit -F commit_msg.txt
          for i in 1 2 3 4; do
            git push origin claude/fx-trading-strategy-i2jwi7 && exit 0
            sleep $((2 ** i))
            git pull --rebase origin claude/fx-trading-strategy-i2jwi7 || true
          done
          echo "PUSH失敗(4回リトライ後)"
          exit 1

      # PAPER_TRADE判定ライン(20シグナル)に到達したらIssueで知らせる
      - name: 昇格審査ラインの検知
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(grep -oP '確定 \K[0-9]+' logs/forward/summary.md | sort -rn | head -1)
          n=${n:-0}
          echo "最大確定シグナル数: ${n}"
          if [ "${n}" -ge 20 ]; then
            {
              cat logs/forward/summary.md
              echo ''
              echo '***'
              echo 'docs/04のPAPER_TRADE基準(実測EV_Rがバックテスト値の50%以上・ルール違反0件)で審査してください。'
              echo '昇格・降格の実行はユーザー承認が必要です。'
            } > issue_body.md
            gh issue create \
              --title "[FX] 前進検証が20シグナルに到達 — 昇格/降格の審査が必要" \
              --body-file issue_body.md \
              --label automated || true
          fi
