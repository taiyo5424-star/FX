name: 月次 データ更新

# 毎月1日 9:00 JST(= 1日 0:00 UTC)。手動実行も可。
# 財務省の介入日次内訳(四半期公表)を自動反映する。知的レビューは別途Routineが担当。
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fx-trading-strategy-i2jwi7
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # 終了コード: 0=変化なし / 10=更新あり / 1=エラー
      - name: 介入日次内訳の反映
        id: iv
        run: |
          set +e
          python scripts/data/update_intervention.py 2>&1 | tee iv_out.txt
          code=${PIPESTATUS[0]}
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 1 ]; then exit 1; fi
          exit 0

      - name: 更新をコミット
        if: steps.iv.outputs.code == '10'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/historical_events.json
          {
            echo "介入実施日を財務省公式CSVから自動更新"
            echo ""
            cat iv_out.txt
            echo ""
            echo "Generated by GitHub Actions (monthly-data-update)"
          } > commit_msg.txt
          git commit -F commit_msg.txt
          for i in 1 2 3 4; do
            git push origin claude/fx-trading-strategy-i2jwi7 && exit 0
            sleep $((2 ** i))
            git pull --rebase origin claude/fx-trading-strategy-i2jwi7 || true
          done
          echo "PUSH失敗(4回リトライ後)"
          exit 1

      - name: 変化をIssueで通知
        if: steps.iv.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            cat iv_out.txt
            echo '```'
            echo ''
            echo '***'
            echo 'イベントフィルタが変わったため、前進検証の結果に影響する可能性があります。'
            echo '検知器の閾値(150pips/30分)の事後検証も再実施を検討してください。'
          } > issue_body.md
          gh issue create \
            --title "[FX] 介入実施日が更新されました($(date -u -d '+9 hours' '+%Y-%m'))" \
            --body-file issue_body.md \
            --label automated
